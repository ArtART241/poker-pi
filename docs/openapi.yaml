          type: integer
          title: Hand No
          description: Number of the hand at this table (1, 2, 3, ...).
        seat:
          type: integer
          title: Seat
          description: Your seat (0-8).
        name:
          type: string
          title: Name
        hole_cards:
          items:
            type: string
          type: array
          title: Hole Cards
