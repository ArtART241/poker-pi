    PlayerView:
      properties:
        seat:
          type: integer
          title: Seat
        name:
          type: string
          title: Name
        stack:
          type: integer
          title: Stack
          description: Chips behind (not counting chips already bet).
        bet:
          type: integer
          title: Bet
          description: Chips this player has bet on the current street.
        committed:
          type: integer
          title: Committed
          description: Chips this player has put into the pot during the whole hand.
        status:
          type: string
          enum:
          - active
          - folded
          - all_in
          title: Status
        is_you:
          type: boolean
          title: Is You
      type: object
      required:
      - seat
      - name
      - stack
      - bet
      - committed
      - status
      - is_you
      title: PlayerView
    PracticeRequest:
      properties:
        opponents:
          items:
            type: string
            enum:
            - random
            - station
            - tight
          type: array
          maxItems: 8
          minItems: 1
          title: Opponents
          description: 'House bots to play against: random, station (calls everything),
            tight (only plays good hands).'
        speed:
          type: string
          enum:
          - fast
          - live
          title: Speed
          description: 'fast: no pauses. live: same pace as tournaments, nice to watch
            in the browser.'
          default: fast
        starting_stack:
          type: integer
          maximum: 100000.0
          minimum: 100.0
          title: Starting Stack
          default: 1500
      type: object
      title: PracticeRequest
      examples:
      - opponents:
        - random
        - station
        - tight
        speed: fast
    PracticeResponse:
      properties:
        table_id:
          type: string
          title: Table Id
        status:
          type: string
          title: Status
        finish_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Finish Reason
        hand_no:
          type: integer
          title: Hand No
        players:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Players
