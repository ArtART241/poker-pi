openapi: 3.1.0
info:
  title: poker-pi
  description: "\n**poker-pi** is a No-Limit Texas Hold'em tournament played by bots.\n\
    \nYour bot talks to this API over plain HTTP + JSON, in any language:\n\n1. `GET\
    \ /api/v1/bot/turn?wait=25` waits until it is your turn and returns the game state\n\
    \   (it answers `204` if nothing happened within 25 seconds, then just ask again).\n\
    2. `POST /api/v1/bot/action` with `{\"turn_id\": \"...\", \"action\": \"call\"\
    }` sends your decision.\n\nEvery bot request needs the header `Authorization:\
    \ Bearer <your token>`.\nClick **Authorize** above, paste your token, and you\
    \ can try every endpoint right here.\n\nThe full guide (English + Deutsch) is\
    \ on the website under **Docs**.\n"
  version: 1.0.0
paths:
  /api/v1/bot/me:
    get:
      tags:
      - Bot API
      summary: Who am I? (good first test of your token)
      operationId: me_api_v1_bot_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - HTTPBearer: []
  /api/v1/bot/turn:
    get:
      tags:
      - Bot API
      summary: Wait until it is your turn (long-poll)
      description: 'Blocks until a decision is needed from your bot, then returns
        the full game state.


        If nothing happens within `wait` seconds the answer is **204 No Content**
        (empty body):

        simply call again. Bots typically run `while True: turn = GET /turn; POST
        /action`.'
      operationId: get_turn_api_v1_bot_turn_get
      security:
      - HTTPBearer: []
      parameters:
      - name: wait
        in: query
        required: false
        schema:
          type: number
          maximum: 30
          minimum: 0
          description: Seconds to wait for a turn before answering 204.
          default: 25
          title: Wait
        description: Seconds to wait for a turn before answering 204.
      - name: table_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only wait for turns at this table.
          title: Table Id
        description: Only wait for turns at this table.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnState'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: Not your turn within `wait` seconds. Just ask again.
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Error'
  /api/v1/bot/action:
    post:
      tags:
      - Bot API
      summary: Send your decision
      description: '`raise` means *raise TO*: `amount` is your total bet for this
        street, not the increase.


        Sending the exact same request twice (e.g. after a network hiccup) is safe.'
      operationId: post_action_api_v1_bot_action_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The turn belongs to another bot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The turn is no longer open (answered, timed out, unknown).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The action is not legal right now (detail says why).
          content:
            application/json:
              schema: *id001
      security:
      - HTTPBearer: []
  /api/v1/bot/tournaments:
    get:
      tags:
      - Bot API
      summary: Upcoming, running and recent tournaments
      operationId: list_tournaments_api_v1_bot_tournaments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TournamentInfo'
                type: array
                title: Response List Tournaments Api V1 Bot Tournaments Get
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - HTTPBearer: []
  /api/v1/bot/tournaments/{tournament_id}/register:
    post:
      tags:
      - Bot API
      summary: Sign up for a tournament
      operationId: register_api_v1_bot_tournaments__tournament_id__register_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tournament_id
        in: path
        required: true
        schema:
          type: integer
          title: Tournament Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          description: Registration closed or full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
    delete:
      tags:
      - Bot API
      summary: Withdraw from a tournament (before it starts)
      operationId: unregister_api_v1_bot_tournaments__tournament_id__register_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: tournament_id
        in: path
        required: true
        schema:
          type: integer
          title: Tournament Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Conflict
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/bot/practice:
    get:
      tags:
      - Bot API
      summary: Your current (or last) practice table
      operationId: get_practice_api_v1_bot_practice_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Bot API
      summary: Start a practice table against house bots
      description: 'Starts a private table for your bot against built-in opponents.
        Results do not count.


        The table ends when your bot busts, wins, stops polling, or after 300 hands.

        Starting a new practice table replaces the old one. Your turns arrive through
        the

        normal `GET /turn` loop.'
      operationId: start_practice_api_v1_bot_practice_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/PracticeRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
      security:
      - HTTPBearer: []
    delete:
      tags:
      - Bot API
      summary: Stop your practice table
      operationId: stop_practice_api_v1_bot_practice_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeResponse'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - HTTPBearer: []
  /api/v1/bot/hands:
    get:
      tags:
      - Bot API
      summary: Finished hands you played in
      operationId: my_hands_api_v1_bot_hands_get
      security:
      - HTTPBearer: []
      parameters:
      - name: table_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Table Id
      - name: tournament_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tournament Id
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Only hands with an id smaller than this (paging).
          title: Before
        description: Only hands with an id smaller than this (paging).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandSummary'
                title: Response My Hands Api V1 Bot Hands Get
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/bot/hands/{hand_id}:
    get:
      tags:
      - Bot API
      summary: Full history of a finished hand
      description: Includes every player's hole cards. Only available once the hand
        is over.
      operationId: hand_detail_api_v1_bot_hands__hand_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: hand_id
        in: path
        required: true
        schema:
          type: integer
          title: Hand Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDetail'
        '401':
          description: Missing, invalid or revoked token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests per second.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/public/tournaments:
    get:
      tags:
      - Public (spectators)
      summary: All tournaments, newest first
      operationId: tournaments_api_v1_public_tournaments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TournamentInfo'
                type: array
                title: Response Tournaments Api V1 Public Tournaments Get
  /api/v1/public/tournaments/{tournament_id}:
    get:
      tags:
      - Public (spectators)
      summary: Tournament details, standings and results
      operationId: tournament_api_v1_public_tournaments__tournament_id__get
      parameters:
      - name: tournament_id
        in: path
        required: true
        schema:
          type: integer
          title: Tournament Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/public/tables:
    get:
      tags:
      - Public (spectators)
      summary: Tables that are running (or finished recently)
      operationId: tables_api_v1_public_tables_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TableSummary'
                type: array
                title: Response Tables Api V1 Public Tables Get
  /api/v1/public/tables/{table_id}:
    get:
      tags:
      - Public (spectators)
      summary: Current state of a table (no hidden cards)
      operationId: table_api_v1_public_tables__table_id__get
      parameters:
      - name: table_id
        in: path
        required: true
        schema:
          type: string
          title: Table Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSnapshot'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/public/tables/{table_id}/stream:
    get:
      tags:
      - Public (spectators)
      summary: Live events of a table (Server-Sent Events)
      description: 'A never-ending `text/event-stream` response. The first message
        is a `snapshot`

        (same as `GET /tables/{id}`), then one message per event. A comment line is
        sent

        every 15 seconds to keep the connection alive.'
      operationId: stream_api_v1_public_tables__table_id__stream_get
      parameters:
      - name: table_id
        in: path
        required: true
        schema:
          type: string
          title: Table Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/event-stream: {}
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/public/hands:
    get:
      tags:
      - Public (spectators)
      summary: Finished hands (newest first)
      operationId: hands_api_v1_public_hands_get
      parameters:
      - name: table_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Table Id
      - name: tournament_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tournament Id
      - name: bot
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bot name
          title: Bot
        description: Bot name
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Only hands with an id smaller than this (paging).
          title: Before
        description: Only hands with an id smaller than this (paging).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandSummary'
                title: Response Hands Api V1 Public Hands Get
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/public/hands/{hand_id}:
    get:
      tags:
      - Public (spectators)
      summary: Full replay of a finished hand
      operationId: hand_api_v1_public_hands__hand_id__get
      parameters:
      - name: hand_id
        in: path
        required: true
        schema:
          type: integer
          title: Hand Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandDetail'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
  /api/v1/public/leaderboard:
    get:
      tags:
      - Public (spectators)
      summary: All-time tournament leaderboard
      operationId: leaderboard_api_v1_public_leaderboard_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LeaderboardRow'
                type: array
                title: Response Leaderboard Api V1 Public Leaderboard Get
  /api/v1/public/bots:
    get:
      tags:
      - Public (spectators)
      summary: All registered bots
      operationId: bots_api_v1_public_bots_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BotInfo'
                type: array
                title: Response Bots Api V1 Public Bots Get
  /api/v1/public/bots/{name}:
    get:
      tags:
      - Public (spectators)
      summary: Profile and statistics of a bot
      operationId: bot_profile_api_v1_public_bots__name__get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotProfile'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '422':
          description: The request is malformed (detail says why).
          content:
            application/json:
              schema: *id001
components:
  schemas:
    ActionRequest:
      properties:
        turn_id:
          type: string
          title: Turn Id
          description: The turn_id from GET /turn.
        action:
          type: string
          title: Action
          description: 'fold | check | call | raise (also accepted: bet = raise, allin).'
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
          description: 'Only for raise: the total bet to raise TO.'
      type: object
      required:
      - turn_id
      - action
      title: ActionRequest
      examples:
      - action: call
        turn_id: t_3f9a0c1b2d4e5f60
      - action: raise
        amount: 120
        turn_id: t_3f9a0c1b2d4e5f60
    ActionResponse:
      properties:
        accepted:
          type: boolean
          title: Accepted
        action:
          type: string
          title: Action
        amount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount
      type: object
      required:
      - accepted
      - action
      title: ActionResponse
    BlindsInfo:
      properties:
        small:
          type: integer
          title: Small
        big:
          type: integer
          title: Big
        ante:
          type: integer
          title: Ante
        level:
          type: integer
          title: Level
        hands_until_next_level:
          type: integer
          title: Hands Until Next Level
      type: object
      required:
      - small
      - big
      - ante
      - level
      - hands_until_next_level
      title: BlindsInfo
    BotInfo:
      properties:
        name:
          type: string
          title: Name
        owner:
          type: string
          title: Owner
        created_at:
          type: string
          title: Created At
        connected:
          type: boolean
          title: Connected
      type: object
      required:
      - name
      - owner
      - created_at
      - connected
      title: BotInfo
    BotProfile:
      properties:
        name:
          type: string
          title: Name
        owner:
          type: string
          title: Owner
        created_at:
          type: string
          title: Created At
        connected:
          type: boolean
          title: Connected
        tables:
          items:
            $ref: '#/components/schemas/BotTable'
          type: array
          title: Tables
        stats:
          $ref: '#/components/schemas/BotStats'
      type: object
      required:
      - name
      - owner
      - created_at
      - connected
      - tables
      - stats
      title: BotProfile
    BotStats:
      properties:
        hands:
          type: integer
          title: Hands
          description: Tournament hands played.
        hands_won:
          type: integer
          title: Hands Won
        net_chips:
          type: integer
          title: Net Chips
        practice_hands:
          type: integer
          title: Practice Hands
        tournaments:
          items:
            $ref: '#/components/schemas/BotTournamentResult'
          type: array
          title: Tournaments
        points:
          type: integer
          title: Points
        wins:
          type: integer
          title: Wins
      type: object
      required:
      - hands
      - hands_won
      - net_chips
      - practice_hands
      - tournaments
      - points
      - wins
      title: BotStats
    BotTable:
      properties:
        table_id:
          type: string
          title: Table Id
        kind:
          type: string
          enum:
          - tournament
          - practice
          title: Kind
        title:
          type: string
          title: Title
      type: object
      required:
      - table_id
      - kind
      - title
      title: BotTable
    BotTournamentResult:
      properties:
        tournament_id:
          type: integer
          title: Tournament Id
        tournament:
          type: string
          title: Tournament
          description: Tournament name.
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        place:
          type: integer
          title: Place
        points:
          type: integer
          title: Points
        players:
          type: integer
          title: Players
      type: object
      required:
