        deadline_ms:
          type: integer
          title: Deadline Ms
          description: Milliseconds left to answer before you are auto-checked/folded.
        table_id:
          type: string
          title: Table Id
        tournament_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tournament Id
        practice:
          type: boolean
          title: Practice
        hand_id:
          type: integer
          title: Hand Id
